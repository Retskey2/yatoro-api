name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint · Types · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test

  postgres:
    name: Migrations & smoke test on PostgreSQL 18
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: yatoro
          POSTGRES_PASSWORD: yatoro
          POSTGRES_DB: yatoro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yatoro -d yatoro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: production
      DATABASE_URL: postgresql://yatoro:yatoro@localhost:5432/yatoro
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      SEED_ADMIN_EMAIL: admin@yatoro.local
      SEED_ADMIN_PASSWORD: ci-admin-password
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Apply migrations to an empty database
        run: bun run db:migrate

      - name: Seed twice (must be idempotent)
        run: bun run db:seed && bun run db:seed

      - name: Smoke test the running server
        run: |
          # Run the file directly (not via `bun run start`) so $! is the server itself
          bun src/index.ts > server.log 2>&1 &
          SERVER_PID=$!
          curl --silent --fail --retry 20 --retry-all-errors --retry-delay 1 http://localhost:5084/health

          curl --silent --fail "http://localhost:5084/api/anime?limit=3" | grep -q '"items"'

          # Hybrid search on real PostgreSQL. The typo "фрирэн" only matches if the trigram
          # threshold reached the session via the postgres-js startup parameter (default 0.6 → no hit)
          curl --silent --fail -G "http://localhost:5084/api/anime" --data-urlencode "q=фрирэн" \
            | jq -e '.items[0].slug == "sousou-no-frieren"'
          curl --silent --fail -G "http://localhost:5084/api/anime" --data-urlencode "q=алхимики" \
            | jq -e '[.items[].slug] | index("fullmetal-alchemist-brotherhood") != null'

          TOKEN=$(curl --silent --fail -X POST http://localhost:5084/api/auth/login \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$SEED_ADMIN_EMAIL\",\"password\":\"$SEED_ADMIN_PASSWORD\"}" \
            | jq -r .accessToken)

          curl --silent --fail -X POST http://localhost:5084/api/genres \
            -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"name":"Меха","slug":"mecha"}' | jq -e '.name == "Меха"'

          # Audit log on real PostgreSQL: the change above must be recorded with its author
          curl --silent --fail "http://localhost:5084/api/admin/audit-log?action=genre.create" \
            -H "authorization: Bearer $TOKEN" \
            | jq -e '.items[0].changes.slug.to == "mecha" and .items[0].actor.username == "admin"'

          # Graceful shutdown: SIGTERM must end with a clean exit
          kill -TERM "$SERVER_PID"
          wait "$SERVER_PID"
          grep -q "Сервер остановлен" server.log

      - name: Server log
        if: always()
        run: cat server.log || true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: yatoro-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stack:
    # SeaweedFS needs command-line arguments, which service containers cannot pass,
    # so the whole stack is started exactly as on a developer machine
    name: Full stack (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start PostgreSQL + SeaweedFS + API
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 240

      - name: Health, storage and bucket CORS
        run: |
          curl --silent --fail http://localhost:5084/health \
            | jq -e '.status == "ok" and .database == "up" and .storage == "up"'

          preflight() {
            curl --silent -o /dev/null -D - -X OPTIONS "http://localhost:9000/yatoro-media/probe.mp4" \
              -H "Origin: $1" -H "Access-Control-Request-Method: PUT"
          }
          # The demo page may upload straight to the bucket, a foreign site may not
          preflight http://localhost:5084 | grep -qi "access-control-allow-origin: http://localhost:5084"
          ! preflight http://evil.example | grep -qi "access-control-allow-origin"

      - name: Worker and job queue on real PostgreSQL
        run: |
          docker compose logs worker | grep -q "worker ready"
          docker compose exec -T worker ffmpeg -version | head -1

          # Enqueue through our transactions: one commits, one rolls back
          docker compose exec -T api bun -e '
            import { db } from "@/database";
            import { enqueue, QUEUES, stopJobQueue } from "@/queue";
            await db.transaction((tx) => enqueue(tx, QUEUES.transcode, { episodeId: 42, sourceKey: "ci/42.mp4" }));
            await db.transaction(async (tx) => {
              await enqueue(tx, QUEUES.transcode, { episodeId: 43, sourceKey: "ci/43.mp4" });
              throw new Error("rollback on purpose");
            }).catch(() => {});
            await stopJobQueue();
            process.exit(0);'

          # The committed job reaches the worker...
          for i in $(seq 1 30); do docker compose logs worker | grep -q '"episodeId":42' && break; sleep 1; done
          docker compose logs worker | grep -q '"episodeId":42'
          # ...and the rolled-back one never existed
          test "$(docker compose exec -T postgres psql -U yatoro -d yatoro -tAc \
            "select count(*) from pgboss.job where data->>'episodeId' = '43'")" = "0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Video upload end to end (presigned upload, verification, queue, cleanup)
        run: bun scripts/e2e-video.ts

      - name: Worker stops gracefully
        run: |
          docker compose stop worker
          docker compose logs worker | grep -q "Воркер остановлен"

      - name: Restart is idempotent (no duplicate seed, existing bucket kept)
        run: |
          docker compose restart api
          curl --silent --fail --retry 30 --retry-all-errors --retry-delay 1 http://localhost:5084/health > /dev/null
          docker compose logs api | grep -q "Seed: админ уже был, аниме добавлено: 0"
          docker compose logs api | grep -q '"created":false'

      - name: Logs
        if: always()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
